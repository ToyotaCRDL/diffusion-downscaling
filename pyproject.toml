[project]
name = "diffusion_ds"
description = "Diffusion-based downscaling"
authors = [{ name = "ta-kutsuna" }]
version = "1.0.0"
requires-python = "== 3.10.12"
readme = "README.md"
dependencies = [
    "numpy<2",
    "torch==2.1.2",
    "diffusers @ git+https://github.com/huggingface/diffusers@ec9840a",
    "huggingface-hub==0.25.2",
    "mmengine==0.10.4",
    "safetensors==0.4.1",
]
license = { file = "LICENSE" }
keywords = ["diffusion models", "climate downscaling"]

[tool.setuptools.packages.find]
include = ["diffengine*"]
exclude = [
    "docs*",
    "tests*",
    "docker*",
    "data*",
    "work_dirs*",
    "projects*",
]
